<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>けいばびより｜Scene03 v14｜スマホ向け・起伏試作</title><link rel="stylesheet" href="style.css"></head>
